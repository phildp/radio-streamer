name: Release RadioStreamer

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release image
        run: docker build -f Dockerfile.goreleaser -t radio-streamer-goreleaser .

      - name: Run GoReleaser
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            --entrypoint sh \
            radio-streamer-goreleaser \
            -c 'git config --global --add safe.directory /app && exec goreleaser release --clean'
